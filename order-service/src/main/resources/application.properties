
# =========================================================
# APPLICATION
# =========================================================

spring.application.name=order-service
server.port=8081

# =========================================================
# EUREKA
# =========================================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# =========================================================
# ORACLE DATASOURCE
# =========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/orderdb
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# HIKARI CONNECTION POOL
# =========================================================

spring.datasource.hikari.pool-name=OrderServiceHikariPool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-timeout=5000

# =========================================================
# JPA / HIBERNATE
# =========================================================

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true


# =========================================================
# KAFKA
# =========================================================

spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

# Consumer
spring.kafka.consumer.group-id=order-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.listener.ack-mode=manual

# =========================================================
# OUTBOX
# =========================================================

app.outbox.publisher.enabled=true
app.outbox.publisher.batch-size=50
app.outbox.publisher.fixed-delay-ms=3000

# =========================================================
# OPENAPI
# =========================================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# =========================================================
# ACTUATOR
# =========================================================

management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus

management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

management.health.db.enabled=true
management.health.diskspace.enabled=true

management.info.env.enabled=true

management.metrics.tags.application=${spring.application.name}

info.app.name=Order Service
info.app.description=Enterprise Order Processing Microservice
info.app.version=1.0.0

# =========================================================
# LOGGING
# =========================================================

logging.level.com.enterprise.order=ERROR
logging.level.org.springframework.kafka=ERROR
logging.level.org.hibernate.SQL=ERROR
logging.level.org.springframework.orm.jpa=ERROR
