# ==========================================
# APPLICATION
# ==========================================

spring.application.name=inventory-service
server.port=8082

# ==========================================
# ORACLE DATABASE
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/inventorydb
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# HIKARICP CONNECTION POOL
# ==========================================

spring.datasource.hikari.pool-name=InventoryHikariPool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.validation-timeout=5000

# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.sql.init.mode=never

# ==========================================
# EUREKA
# ==========================================

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ==========================================
# KAFKA
# ==========================================

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.properties.enable.idempotence=true

# Consumer
spring.kafka.consumer.group-id=inventory-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Manual acknowledgment
spring.kafka.listener.ack-mode=manual_immediate

# ==========================================
# OUTBOX PUBLISHER
# ==========================================

app.outbox.publisher.enabled=true
app.outbox.publisher.batch-size=50
app.outbox.publisher.fixed-delay-ms=3000
app.outbox.publisher.claim-timeout-minutes=5

# ==========================================
# SWAGGER
# ==========================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==========================================
# ACTUATOR
# ==========================================

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.health.db.enabled=true
management.info.env.enabled=true

info.app.name=Inventory Service
info.app.description=Enterprise Inventory Management Microservice
info.app.version=1.0.0

# ==========================================
# LOGGING
# ==========================================

logging.level.com.enterprise.inventory=DEBUG
logging.level.org.springframework.kafka=DEBUG
logging.level.com.zaxxer.hikari=DEBUG