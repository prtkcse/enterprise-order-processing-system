# ==========================================
# APPLICATION
# ==========================================

spring.application.name=notification-service
server.port=8084

# ==========================================
# ORACLE DATABASE
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/notificationdb
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.pool-name=NotificationHikariPool

# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false

logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate=ERROR

spring.jpa.properties.hibernate.format_sql=false

# ==========================================
# EUREKA
# ==========================================

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# ==========================================
# KAFKA
# ==========================================

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.consumer.group-id=notification-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.listener.ack-mode=manual_immediate

# ==========================================
# KAFKA TOPICS
# ==========================================

app.kafka.topic.payment-completed=payment.completed
app.kafka.topic.payment-failed=payment.failed

# ==========================================
# OPENAPI
# ==========================================

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==========================================
# ACTUATOR / PROMETHEUS
# ==========================================

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Prometheus metrics
management.endpoint.prometheus.access=read-only
management.prometheus.metrics.export.enabled=true

# ==========================================
# LOGGING
# ==========================================

logging.level.root=INFO
logging.level.enterprise.sharma.prateek=INFO
logging.level.org.springframework.kafka=WARN
logging.level.com.netflix.discovery=WARN
logging.level.org.springframework.web.client.RestTemplate=WARN
logging.level.org.apache.hc.client5=WARN
logging.level.org.apache.hc.client5.http.wire=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN