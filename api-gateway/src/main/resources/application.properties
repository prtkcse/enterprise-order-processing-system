
spring.application.name=api-gateway

server.port=8080

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Gateway Routes

# Order Service
spring.cloud.gateway.routes[0].id=order-service
spring.cloud.gateway.routes[0].uri=lb://ORDER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/orders/**

# Inventory Service
spring.cloud.gateway.routes[1].id=inventory-service
spring.cloud.gateway.routes[1].uri=lb://INVENTORY-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/inventory/**

# Payment Service
spring.cloud.gateway.routes[2].id=payment-service
spring.cloud.gateway.routes[2].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/payments/**

# Notification Service
spring.cloud.gateway.routes[3].id=notification-service
spring.cloud.gateway.routes[3].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/notifications/**

# Swagger routes

spring.cloud.gateway.routes[4].id=order-service-swagger
spring.cloud.gateway.routes[4].uri=lb://ORDER-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/order-docs/**
spring.cloud.gateway.routes[4].filters[0]=RewritePath=/order-docs/(?<segment>.*), /${segment}

spring.cloud.gateway.routes[5].id=inventory-service-swagger
spring.cloud.gateway.routes[5].uri=lb://INVENTORY-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/inventory-docs/**
spring.cloud.gateway.routes[5].filters[0]=RewritePath=/inventory-docs/(?<segment>.*), /${segment}

spring.cloud.gateway.routes[6].id=payment-service-swagger
spring.cloud.gateway.routes[6].uri=lb://PAYMENT-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/payment-docs/**
spring.cloud.gateway.routes[6].filters[0]=RewritePath=/payment-docs/(?<segment>.*), /${segment}

spring.cloud.gateway.routes[7].id=notification-service-swagger
spring.cloud.gateway.routes[7].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/notification-docs/**
spring.cloud.gateway.routes[7].filters[0]=RewritePath=/notification-docs/(?<segment>.*), /${segment}

# Disable automatic discovery routes
spring.cloud.gateway.discovery.locator.enabled=false

# Gateway HTTP timeouts
spring.cloud.gateway.httpclient.connect-timeout=5000
spring.cloud.gateway.httpclient.response-timeout=10s

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,gateway,prometheus
management.endpoint.health.show-details=always
management.endpoint.gateway.access=read-only

management.info.env.enabled=true

info.app.name=API Gateway
info.app.description=Enterprise Order Platform API Gateway
info.app.version=1.0.0

# Logging
logging.level.org.springframework.cloud.gateway=INFO
logging.level.org.springframework.cloud.loadbalancer=INFO
